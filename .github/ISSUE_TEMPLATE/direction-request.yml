name: Direction Request
description: Submit a request from leadership for evaluation and tracking
title: "[REQUEST] "
type: Story
projects: ["intellicloud/242"]
assignees:
  - Yannick-Intellicloud
body:
  - type: markdown
    attributes:
      value: |
        This request is added automatically to the **Direction Requests** project.

        Priority, area and target date are set by the team during evaluation — do not
        set them here. Describe the need; the team qualifies it.

  - type: input
    id: requester
    attributes:
      label: Requester
      description: Who is making the request, if not you.
      placeholder: Hugo
    validations:
      required: true

  - type: input
    id: request-date
    attributes:
      label: Request date
      description: When was the request made? Often earlier than this issue.
      placeholder: 2026-08-05
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the current situation, and why is this coming up now?
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: What does "done" look like? Describe the result, not the technical solution.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: What is the impact if nothing is done? This is what drives prioritization.
    validations:
      required: true

  - type: input
    id: desired-date
    attributes:
      label: Desired date
      description: Date wanted and why. The target date is confirmed after evaluation.
      placeholder: 2026-09-15 — board presentation
    validations:
      required: false

  - type: input
    id: stakeholders
    attributes:
      label: Stakeholders
      description: Who needs to be consulted, informed, or give approval?
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Verifiable conditions to close this request, if you already know them.
        Otherwise the team completes this during evaluation.
      value: |
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: What must exist first, or what could block this?
    validations:
      required: false

  - type: dropdown
    id: decision-needed
    attributes:
      label: Decision needed
      description: Is a leadership decision required before this can move forward?
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true

  - type: textarea
    id: decision-detail
    attributes:
      label: Decision details
      description: If yes — what decision, by whom, and by when?
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Attachments and references
      description: Links to documents, emails, screenshots or relevant conversations.
    validations:
      required: false
